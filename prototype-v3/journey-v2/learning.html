<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fc" />
    <title>Hiver Omni onboarding</title>
    <!-- The two woff2 faces are 13KB each, but without an explicit preload they
         were requested only once the CSS matched text — landing behind the 1.6MB
         backdrop video in the queue. crossorigin is required even same-origin:
         without it the preload is discarded and the font is fetched twice. -->
    <link rel="preload" href="./assets/hanken-grotesk-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./assets/hanken-grotesk-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="hero-frame" aria-label="Hiver is reading your knowledge source">
      <div class="learning-video-bg learning-video-bg--bleed" aria-hidden="true">
        <video class="learning-video-bg__video" src="./assets/video/company-backdrop.mp4" poster="./assets/video/company-backdrop-poster.jpg" preload="auto" data-continuous autoplay muted loop playsinline disablepictureinpicture></video>
        <div class="learning-video-bg__tint"></div>
        <div class="learning-video-bg__scrim"></div>
      </div>

      <div class="source-chip" id="source-chip">
        <span class="source-chip__icon" id="source-chip-icon" hidden aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2c2.5 2.7 4 6.4 4 10s-1.5 7.3-4 10c-2.5-2.7-4-6.4-4-10s1.5-7.3 4-10Z"/></svg>
        </span>
        <span class="source-chip__text" id="source-chip-text">waiting for sources</span>
      </div>

      <div class="learning-stage" id="learning-stage" aria-live="polite">
        <h2 class="learning-heading">
          <span class="learning-heading__state" id="learning-heading-building" data-active="true">
            <span class="learning-heading__line">Hiver AI will help you build</span>
            <span class="learning-heading__line learning-heading__brand-line">
              <span>an AI agent for</span>
              <span class="learning-brand-icon" id="learning-brand-icon">
                <span class="learning-brand-icon__placeholder" aria-hidden="true"></span>
                <span class="learning-brand-icon__resolved" id="learning-brand-icon-resolved" aria-hidden="true"></span>
              </span>
              <span id="learning-brand-name">your business</span>
            </span>
          </span>
          <span class="learning-heading__state" id="learning-heading-ready">
            <span class="learning-heading__line">Your AI support agent is ready!</span>
          </span>
        </h2>

        <!-- The steps chain is built by learning.js from its STEPS table, so the
             labels and their shimmer copies can never drift
             apart. The collapse keeps its own --steps modifier because try.html
             still renders against the base .learning-stage__collapse rules. -->
        <div class="learning-stage__collapse learning-stage__collapse--steps" id="learning-caption-collapse">
          <div class="learning-stage__collapse-inner">
            <div class="learning-steps" id="learning-steps">
              <ol class="learning-steps__list" id="learning-steps-list"></ol>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="./backdrop.js"></script>
    <script src="./learning.js"></script>
  </body>
</html>
