<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050a16" />
    <title>Hiver Omni — building your agent</title>
    <link rel="stylesheet" href="./building.css" />
  </head>
  <body class="bld-body">
    <!--
      A standalone exploration of the agent-creation wait: a ~30s five-act piece
      where the company's knowledge condenses into the agent. Deliberately not
      wired into styles.css — it shares no layout classes with the journey, so
      keeping it in its own stylesheet means it cannot disturb a built screen.
    -->
    <main class="bld" aria-label="Building your AI support agent">
      <div class="bld__field">
        <canvas class="bld__canvas" id="bld-canvas" aria-hidden="true"></canvas>
        <div class="bld__grain" id="bld-grain" aria-hidden="true"></div>
        <div class="bld__vignette" aria-hidden="true"></div>

        <div class="bld__core" id="bld-core" aria-hidden="true">
          <span class="bld__core-badge" id="bld-core-badge"></span>
        </div>
      </div>

      <p class="bld__eyebrow" id="bld-eyebrow">Building your AI agent</p>

      <div class="bld__narration" id="bld-narration" aria-live="polite">
        <span class="bld__line" id="bld-line" data-text=""></span>
      </div>

      <div class="bld__finale" id="bld-finale">
        <h1 class="bld__title" id="bld-agent-name">Your Support</h1>
        <p class="bld__subtitle" id="bld-subtitle">Your AI agent</p>
      </div>
    </main>

    <script src="./building.js"></script>
  </body>
</html>
