<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fc" />
    <title>Hiver Omni — indexing your knowledge base</title>
    <!--
      Third animation. The previous attempt was a glowing sphere with orbiting
      particles — a screensaver, not a support tool. This one shows the work
      instead of illustrating it.

      The premise: for thirty seconds a crawler is running against the customer's
      site, so show the crawler. Real URLs resolve one by one, topics get
      discovered and counted, three figures tick up, and the panel ends as the
      agent's finished knowledge base. Everything on screen is an artifact the
      product would genuinely produce, which is what makes the wait credible
      rather than decorative.

      No canvas, no particles, no glow. One product surface — the same white,
      16px-radius, layered-shadow panel the sources card on step 2 uses —
      assembling itself over the journey's own wave.
    -->
    <link rel="stylesheet" href="./agent-animation-claude-3.css" />
  </head>
  <body class="ix-body">
    <main class="ix">
      <video class="ix__wave" src="./assets/video/company-backdrop.mp4" autoplay muted loop playsinline></video>
      <div class="ix__tint" aria-hidden="true"></div>
      <div class="ix__veil" aria-hidden="true"></div>

      <section class="ix-panel" id="ix-panel" aria-label="Building your knowledge base">
        <header class="ix-panel__head">
          <span class="ix-badge" id="ix-badge"></span>
          <div class="ix-panel__id">
            <p class="ix-panel__domain" id="ix-domain">your site</p>
            <p class="ix-panel__sub">Knowledge base</p>
          </div>
          <span class="ix-status" id="ix-status" data-state="idle">
            <span class="ix-status__dot" aria-hidden="true"></span>
            <span id="ix-status-text">Connecting</span>
          </span>
        </header>

        <div class="ix-bar" aria-hidden="true"><span class="ix-bar__fill" id="ix-bar"></span></div>

        <div class="ix-body-grid">
          <section class="ix-block">
            <p class="ix-block__label">Sources</p>
            <!-- Fixed window with the list translated upward, so it reads as a
                 live feed rather than a growing list that shoves the panel about. -->
            <div class="ix-log">
              <ul class="ix-log__list" id="ix-log-list"></ul>
            </div>
          </section>

          <section class="ix-block ix-block--topics" id="ix-topics-block">
            <p class="ix-block__label">Topics found</p>
            <div class="ix-chips" id="ix-chips"></div>
          </section>
        </div>

        <footer class="ix-stats" id="ix-stats">
          <div class="ix-stat"><strong id="ix-pages">0</strong><span>pages</span></div>
          <div class="ix-stat"><strong id="ix-articles">0</strong><span>articles</span></div>
          <div class="ix-stat"><strong id="ix-topics">0</strong><span>topics</span></div>
          <p class="ix-stats__note" id="ix-note">Reading your website</p>
        </footer>
      </section>

      <p class="ix-ready" id="ix-ready">
        <span id="ix-ready-name">Your support agent</span> is ready to test
      </p>
    </main>

    <script src="./agent-animation-claude-3.js"></script>
  </body>
</html>
