<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Hiver Omni onboarding</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="onboarding-frame onboarding-frame--company">
      <section class="form-pane" aria-labelledby="invite-title">
        <div class="page">
          <header class="product-header product-header--company">
            <div class="step-progress" aria-label="Onboarding progress: step 3 of 4">
              <span class="step-progress__segment is-complete"></span>
              <span class="step-progress__segment is-complete"></span>
              <span class="step-progress__segment is-active"></span>
              <span class="step-progress__segment"></span>
            </div>

            <button class="support-button" type="button" aria-label="Get help">
              <svg viewBox="0 0 16 16" data-icon-system="figma-export" data-icon-name="ChatBubbleOutline" aria-hidden="true">
                <path d="M13.3333 1.33333H2.66667C1.93333 1.33333 1.33333 1.93333 1.33333 2.66667V14.6667L4 12H13.3333C14.0667 12 14.6667 11.4 14.6667 10.6667V2.66667C14.6667 1.93333 14.0667 1.33333 13.3333 1.33333ZM13.3333 10.6667H4L2.66667 12V2.66667H13.3333V10.6667Z" fill="currentColor" />
              </svg>
            </button>
          </header>

          <form class="company-step" id="invite-form">
            <div class="company-step__fields">
              <div class="company-heading">
                <h1 id="invite-title">Let&rsquo;s bring your team onboard!</h1>
              </div>

              <div class="company-fields invite-fields">
                <div class="company-field">
                  <span class="company-field__icon" aria-hidden="true">
                    <svg viewBox="0 0 14 14" fill="none">
                      <path d="M7 8.75C5.15079 8.75 3.5063 9.64287 2.45933 11.0285C2.23399 11.3267 2.12133 11.4758 2.12501 11.6773C2.12786 11.833 2.22563 12.0294 2.34813 12.1256C2.50669 12.25 2.72642 12.25 3.16589 12.25H10.8341C11.2736 12.25 11.4933 12.25 11.6519 12.1256C11.7744 12.0294 11.8721 11.833 11.875 11.6773C11.8787 11.4758 11.766 11.3267 11.5407 11.0285C10.4937 9.64287 8.84921 8.75 7 8.75Z" stroke="currentColor" stroke-width="0.99" stroke-linecap="round" stroke-linejoin="round" />
                      <path d="M7 7C8.44975 7 9.625 5.82475 9.625 4.375C9.625 2.92525 8.44975 1.75 7 1.75C5.55025 1.75 4.375 2.92525 4.375 4.375C4.375 5.82475 5.55025 7 7 7Z" stroke="currentColor" stroke-width="0.99" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                  </span>
                  <input type="email" id="invite-email-1" name="teammate1" placeholder="teammate@yourcompany.com" autocomplete="off" />
                </div>
                <div class="company-field">
                  <span class="company-field__icon" aria-hidden="true">
                    <svg viewBox="0 0 14 14" fill="none">
                      <path d="M7 8.75C5.15079 8.75 3.5063 9.64287 2.45933 11.0285C2.23399 11.3267 2.12133 11.4758 2.12501 11.6773C2.12786 11.833 2.22563 12.0294 2.34813 12.1256C2.50669 12.25 2.72642 12.25 3.16589 12.25H10.8341C11.2736 12.25 11.4933 12.25 11.6519 12.1256C11.7744 12.0294 11.8721 11.833 11.875 11.6773C11.8787 11.4758 11.766 11.3267 11.5407 11.0285C10.4937 9.64287 8.84921 8.75 7 8.75Z" stroke="currentColor" stroke-width="0.99" stroke-linecap="round" stroke-linejoin="round" />
                      <path d="M7 7C8.44975 7 9.625 5.82475 9.625 4.375C9.625 2.92525 8.44975 1.75 7 1.75C5.55025 1.75 4.375 2.92525 4.375 4.375C4.375 5.82475 5.55025 7 7 7Z" stroke="currentColor" stroke-width="0.99" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                  </span>
                  <input type="email" id="invite-email-2" name="teammate2" placeholder="teammate@yourcompany.com" autocomplete="off" />
                </div>
                <div class="company-field">
                  <span class="company-field__icon" aria-hidden="true">
                    <svg viewBox="0 0 14 14" fill="none">
                      <path d="M7 8.75C5.15079 8.75 3.5063 9.64287 2.45933 11.0285C2.23399 11.3267 2.12133 11.4758 2.12501 11.6773C2.12786 11.833 2.22563 12.0294 2.34813 12.1256C2.50669 12.25 2.72642 12.25 3.16589 12.25H10.8341C11.2736 12.25 11.4933 12.25 11.6519 12.1256C11.7744 12.0294 11.8721 11.833 11.875 11.6773C11.8787 11.4758 11.766 11.3267 11.5407 11.0285C10.4937 9.64287 8.84921 8.75 7 8.75Z" stroke="currentColor" stroke-width="0.99" stroke-linecap="round" stroke-linejoin="round" />
                      <path d="M7 7C8.44975 7 9.625 5.82475 9.625 4.375C9.625 2.92525 8.44975 1.75 7 1.75C5.55025 1.75 4.375 2.92525 4.375 4.375C4.375 5.82475 5.55025 7 7 7Z" stroke="currentColor" stroke-width="0.99" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                  </span>
                  <input type="email" id="invite-email-3" name="teammate3" placeholder="teammate@yourcompany.com" autocomplete="off" />
                </div>
              </div>
            </div>

            <div class="company-step__footer">
              <div class="form-footer--split">
                <button class="back-button" type="button" id="back-button" aria-label="Back">
                  <svg viewBox="0 0 14 14"><path d="M5.25 10.5L8.75 7L5.25 3.5" /></svg>
                </button>
                <button class="continue-button" type="submit">Continue</button>
              </div>
            </div>
          </form>
        </div>
      </section>

      <aside class="landscape-pane landscape-pane--framed" aria-label="Bring your team onboard">
        <div class="video-card">
          <img class="landscape-image landscape-image--contain" src="./assets/invite/team-hero.png" alt="" />
        </div>
      </aside>
    </main>

    <script src="./invite.js"></script>
  </body>
</html>
